<body class="bg-gray-100 flex flex-col h-[100dvh] overflow-hidden">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />

            <span class="text-base md:text-lg font-bold truncate">🗺️ GIS Survey</span>

            <div class="hidden sm:flex items-center space-x-2">

                <select id="role-selector" class="text-black text-xs rounded px-1.5 py-0.5 font-semibold focus:outline-none shadow-sm bg-gray-200 pointer-events-none" disabled>
                    <option value="admin">Admin</option>

            <div class="text-[11px] sm:text-xs bg-blue-700 px-2.5 py-1 rounded truncate max-w-[150px] shadow-inner">

    <div id="app-main" class="flex flex-1 relative overflow-hidden hidden">
        
        <aside id="sidebar" class="absolute md:relative z-30 inset-y-0 left-0 w-80 bg-white shadow-lg flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out overflow-y-auto">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 shrink-0">
                <div>
                    <h2 class="font-bold text-gray-800 text-lg">Panel Kontrol</h2>
                </div>
                <button id="sidebar-close" class="md:hidden text-gray-500 hover:text-red-500 font-bold text-lg px-2 transition">✕</button>
            </div>

            <div id="admin-section" class="p-4 border-b bg-blue-50/50 shrink-0 hidden">
                <h3 class="font-semibold text-sm text-blue-700 mb-2 flex items-center">
                    <span class="mr-1">📤</span> Upload KMZ
                </h3>
                <input type="file" id="kmz-file-input" accept=".kmz, .kml" class="block w-full text-xs text-gray-600 file:mr-2 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200 mb-2 cursor-pointer transition">
                <button id="upload-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 px-4 rounded transition shadow-sm">
                    Proses & Simpan
                </button>
            </div>

            <div class="p-4 border-b shrink-0">
                <h3 class="font-semibold text-sm text-gray-700 mb-2">📂 Pilih Area / Boundary</h3>
                <select id="boundary-select" class="w-full text-sm border-gray-300 rounded p-2 focus:ring focus:ring-blue-200 focus:border-blue-500 shadow-sm border bg-white">
                    <option value="">-- Memuat Area --</option>
                </select>
            </div>

            <div class="p-4 border-b shrink-0">
                <h3 class="font-semibold text-sm text-gray-700 mb-2">📍 Opsi Survey</h3>
                <div id="export-kmz-container" class="grid grid-cols-1 gap-2 hidden">
                    <button id="btn-export-kmz" class="bg-amber-500 hover:bg-amber-600 text-white text-xs py-2 px-2 rounded font-medium shadow-sm transition">📥 Export KMZ</button>
                </div>

                    ⚡ Sentuh/klik langsung di area peta untuk menambah objek survey.
                </div>
            </div>

            <div id="object-list-section" class="p-4 flex-1 flex flex-col min-h-[250px] bg-gray-50 hidden">
                <h3 class="font-semibold text-sm text-gray-700 mb-3 flex items-center justify-between shrink-0">

                </h3>

    <div id="survey-modal" class="fixed inset-0 bg-black/50 z-[9999] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-sm overflow-hidden transform transition-all">
            <div class="bg-blue-600 text-white px-4 py-3 font-bold text-sm flex justify-between items-center">

            </div>

                <div id="step-category" class="space-y-3">

                        <label class="block text-xs font-semibold text-gray-700">Jenis Pole:</label>

                            <option value="T7-2,5">T7-2,5</option>
                            <option value="T7-3">T7-3</option>
                            <option value="T7-4">T7-4</option>
                            <option value="T9-4">T9-4</option>
                        </select>
                        <select id="modal-jenis-pole-ext" class="w-full text-sm border-gray-300 rounded p-2 border bg-white focus:ring focus:ring-blue-200 hidden">
                            <option value="Biznet">Biznet</option>
                            <option value="Moratel">Moratel</option>
                            <option value="PLN">PLN</option>
                            <option value="Telkom">Telkom</option>
                            <option value="XL">XL</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>

                    <div class="mt-2">
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Objek (Dapat Diedit):</label>
                        <input type="text" id="modal-object-name" class="w-full text-sm border-gray-300 rounded p-2 border focus:ring focus:ring-blue-200" value="NN">
                    </div>

            </div>
            <div class="bg-gray-50 px-4 py-3 flex justify-end space-x-2 border-t">
                <button onclick="closeSurveyModal()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 text-xs font-bold py-2 px-4 rounded transition">Batal</button>
                <button id="modal-save-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 px-4 rounded transition">Simpan Titik</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
    <script>
        // ==========================================
        // 0. UTILS & HELPER FUNCTIONS
        // ==========================================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.innerText = message;
            toast.className = `fixed top-4 right-4 z-[999999] px-4 py-3 rounded shadow-lg text-xs font-bold text-white transition-all transform duration-300 max-w-sm ${
                type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-emerald-600' : 'bg-blue-600'
            }`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ==========================================
        // 1. SUPABASE CLIENT & AUTH
        // ==========================================
        const SUPABASE_URL = 'https://dqlbumvnklzvzekxcawc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxbGJ1bXZua2x6dnpla3hjYXdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MjA4NjMsImV4cCI6MjEwNDE5Njg2M30.LdtDCrgVEYNm7PQ5L57-OuWB38Ada8o2q-TZsNfQRgo';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginModal = document.getElementById('login-modal');
        const loginEmailInput = document.getElementById('login-email');
        const loginPasswordInput = document.getElementById('login-password');
        const loginBtn = document.getElementById('login-btn');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');

        async function checkAuthSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session?.user) {
                await handleSuccessfulLogin(session.user);
            } else {
                loginModal.classList.remove('hidden');
            }
        }

        async function handleSuccessfulLogin(user) {
            loginModal.classList.add('hidden');
            if (logoutBtn) logoutBtn.classList.remove('hidden');

            document.getElementById('app-header').classList.remove('hidden');
            document.getElementById('app-main').classList.remove('hidden');

            setTimeout(() => {
                if (window.map) window.map.invalidateSize();
            }, 200);

            let userRole = 'surveyor';
            let userName = user.email.split('@')[0];

            try {
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('role, name')
                    .eq('id', user.id)
                    .maybeSingle();
                
                if (profile) {
                    if (profile.role) userRole = profile.role;
                    if (profile.name) userName = profile.name;
                }
            } catch (err) {
                console.warn("Profil tabel tidak ditemukan, menggunakan role default.");
            }

            const roleSelectorEl = document.getElementById('role-selector');
            const currentUserLabelEl = document.getElementById('current-user-label');
            
            if (roleSelectorEl) roleSelectorEl.value = userRole;
            if (currentUserLabelEl) currentUserLabelEl.innerText = userName;

            updateRoleUI();
            await loadBoundaries();
            setupRealtimeSubscription();
        }

        if (loginBtn) {
            loginBtn.addEventListener('click', async () => {
                const email = loginEmailInput.value.trim();
                const password = loginPasswordInput.value.trim();

                if (!email || !password) {
                    loginError.innerText = 'Email dan password wajib diisi!';
                    loginError.classList.remove('hidden');
                    return;
                }

                loginBtn.innerText = 'Memproses...';
                loginBtn.disabled = true;
                loginError.classList.add('hidden');

                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

                loginBtn.innerText = 'Masuk Aplikasi';
                loginBtn.disabled = false;

                if (error) {
                    loginError.innerText = 'Login gagal: ' + error.message;
                    loginError.classList.remove('hidden');
                } else if (data.session) {
                    await handleSuccessfulLogin(data.session.user);
                }
            });
        }

        if (logoutBtn) {
            logoutBtn.addEventListener('click', async () => {
                await supabaseClient.auth.signOut();
                window.location.reload();
            });
        }

        // ==========================================
        // 2. MAP INIT & LAYERS
        // ==========================================
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 21, maxNativeZoom: 19, attribution: '© OpenStreetMap' });
        const earthLayer = L.tileLayer('https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 21, maxNativeZoom: 20, subdomains: ['0', '1', '2', '3'], attribution: '© Google Satellite' });

        const map = L.map('map', { 
            center: [-2.548926, 118.014863], 
            zoom: 5, 
            layers: [earthLayer], 
            zoomControl: false, 
            maxZoom: 21,
            rotate: true,
            touchRotate: true
        });
        window.map = map;
        L.control.zoom({ position: 'topleft' }).addTo(map);

        const baseMaps = { "🌍 Tampilan Earth (Satelit)": earthLayer, "🗺️ Peta Jalan (Standard)": osmLayer };
        L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

        let currentLayerGroup = L.layerGroup().addTo(map);
        let drawnItems = L.layerGroup().addTo(map);
        
        let userLocationMarker = null;
        let currentBoundaryGeoJSON = null;

        const surveyMarkers = new Map();
        const surveyListItems = new Map();
        let folderOpenState = { Homepass: false, Pole: false };

        function getCustomIcon(parsed) {
            if (parsed.type === 'Homepass') {
                return L.divIcon({
                    className: 'custom-survey-marker homepass-icon',
                    html: '<div style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); display: flex; align-items: center; justify-content: center;"><svg width="24" height="32" viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C5.373 0 0 5.373 0 12C0 21 12 32 12 32C12 32 24 21 24 12C24 5.373 18.627 0 12 0Z" fill="#2563EB"/><circle cx="12" cy="12" r="5" fill="white"/></svg></div>',
                    iconSize: [24, 32],
                    iconAnchor: [12, 32],
                    popupAnchor: [0, -32]
                });
            }
            
            let color = '#DC2626';
            if (parsed.type === 'PoleNew') {
                const t = parsed.cleanTitle;
                if (t.includes('T7-2,5')) color = '#aa00ff';
                else if (t.includes('T7-3')) color = '#00ffff';
                else if (t.includes('T7-4')) color = '#00ff00';
                else if (t.includes('T9-4')) color = '#ff0000';
            } else if (parsed.type === 'PoleExt') {
                color = '#ffffff';
            }

            return L.divIcon({
                className: 'custom-survey-marker pole-icon',
                html: `<div style="filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5)); display: flex; align-items: center; justify-content: center;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="10" fill="${color}" stroke="#000000" stroke-width="1.5"/>
                            <circle cx="12" cy="12" r="2.5" fill="#000000" opacity="0.5"/>
                        </svg>
                       </div>`,
                iconSize: [16, 16],
                iconAnchor: [8, 8],
                popupAnchor: [0, -8]
            });
        }

        function getObjectTypeAndCleanName(title) {
            if (!title) return { type: 'Homepass', cleanTitle: 'NN-' };
            if (title.startsWith('[PoleNew]')) {
                return { type: 'PoleNew', cleanTitle: title.replace('[PoleNew]', '').trim() };
            } else if (title.startsWith('[PoleExt]')) {
                return { type: 'PoleExt', cleanTitle: title.replace('[PoleExt]', '').trim() };
            } else if (title.startsWith('[Homepass]')) {
                return { type: 'Homepass', cleanTitle: title.replace('[Homepass]', '').trim() };
            }
            if (title === 'New' || title.toLowerCase().includes('pole new')) {
                return { type: 'PoleNew', cleanTitle: title };
            } else if (title === 'Ext' || title.toLowerCase().includes('pole ext')) {
                return { type: 'PoleExt', cleanTitle: title };
            }
            return { type: 'Homepass', cleanTitle: title };
        }

        function pointInPolygon(point, polygon) {
            let x = point[0], y = point[1];
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                let xi = polygon[i][0], yi = polygon[i][1];
                let xj = polygon[j][0], yj = polygon[j][1];
                let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function isPointInsideBoundary(lat, lng, geojson) {
            if (!geojson || !geojson.features) return true;
            let pt = [lng, lat];
            let insideAny = false;

            function checkPolygonRings(coordinates) {
                if (!coordinates || coordinates.length === 0) return false;
                if (!pointInPolygon(pt, coordinates[0])) return false;
                for (let i = 1; i < coordinates.length; i++) {
                    if (pointInPolygon(pt, coordinates[i])) return false;
                }
                return true;
            }

            for (let feature of geojson.features) {
                let geom = feature.geometry;
                if (!geom) continue;
                if (geom.type === 'Polygon' && checkPolygonRings(geom.coordinates)) insideAny = true;
                else if (geom.type === 'MultiPolygon') {
                    for (let poly of geom.coordinates) {
                        if (checkPolygonRings(poly)) insideAny = true;
                    }
                }
            }
            return insideAny;
        }

        // ==========================================
        // 3. UI & ROLE MANAGEMENT
        // ==========================================
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sidebarClose = document.getElementById('sidebar-close');

        function toggleSidebar() { 
            sidebar.classList.toggle('-translate-x-full');
            setTimeout(() => {
                if (window.map) window.map.invalidateSize();
            }, 300);
        }
        if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
        if (sidebarClose) sidebarClose.addEventListener('click', toggleSidebar);

        const roleSelector = document.getElementById('role-selector');
        const adminSection = document.getElementById('admin-section');
        const currentUserLabel = document.getElementById('current-user-label');
        const exportKmzContainer = document.getElementById('export-kmz-container');
        const objectListSection = document.getElementById('object-list-section');

        function updateRoleUI() {
            if (!roleSelector) return;
            const role = roleSelector.value;
            if (role === 'admin') {
                if (adminSection) adminSection.style.display = 'block';
                if (exportKmzContainer) exportKmzContainer.style.display = 'grid';
                if (objectListSection) objectListSection.style.display = 'flex';
            } else {
                if (adminSection) adminSection.style.display = 'none';
                if (exportKmzContainer) exportKmzContainer.style.display = 'none';
                if (objectListSection) objectListSection.style.display = role === 'surveyor' ? 'flex' : 'none';
            }
            const boundaryId = document.getElementById('boundary-select').value;
            if (boundaryId) loadBoundaryToMap(boundaryId);
            else loadObjectsFromDB(boundaryId);
        }

        async function checkSupabaseConnection() {
            const syncEl = document.getElementById('sync-status');
            if (!syncEl) return;
            try {
                await supabaseClient.from('boundaries').select('id').limit(1);
                syncEl.className = 'text-[10px] bg-green-500 px-2 py-0.5 rounded-full text-white whitespace-nowrap shadow-sm';
                syncEl.innerText = 'Live Sync Active';
            } catch (err) {
                syncEl.className = 'text-[10px] bg-red-500 px-2 py-0.5 rounded-full text-white whitespace-nowrap shadow-sm';
                syncEl.innerText = 'Connection Error';
            }
        }

        // ==========================================
        // 4. BOUNDARY & KMZ UPLOAD LOGIC
        // ==========================================
        async function loadBoundaries() {
            const select = document.getElementById('boundary-select');
            if (!select) return;
            const currentValue = select.value;
            select.innerHTML = '<option value="">-- Memuat Data --</option>';

            try {
                const { data, error } = await supabaseClient.from('boundaries').select('*').order('name');
                if (error) throw error;

                select.innerHTML = '<option value="">-- Pilih Area Survey --</option>';
                data?.forEach(b => {
                    const opt = document.createElement('option');
                    opt.value = b.id;
                    opt.textContent = b.name;
                    select.appendChild(opt);
                });
                if (currentValue) select.value = currentValue;
            } catch (err) {
                select.innerHTML = '<option value="">Gagal memuat area</option>';
            }
        }

        const uploadBtn = document.getElementById('upload-btn');
        if (uploadBtn) {
            uploadBtn.addEventListener('click', async () => {
                const fileInput = document.getElementById('kmz-file-input');
                if (!fileInput || fileInput.files.length === 0) return showToast('Pilih file KMZ/KML terlebih dahulu!', 'error');

                const file = fileInput.files[0];
                uploadBtn.innerText = 'Memproses...'; uploadBtn.disabled = true;

                try {
                    let kmlText = '';
                    if (file.name.toLowerCase().endsWith('.kmz')) {
                        const zip = new JSZip();
                        const zipContent = await zip.loadAsync(file);
                        const kmlFilename = Object.keys(zipContent.files).find(fn => fn.toLowerCase().endsWith('.kml'));
                        if (!kmlFilename) throw new Error('File KML tidak ditemukan di dalam KMZ.');
                        kmlText = await zipContent.files[kmlFilename].async('text');
                    } else {
                        kmlText = await file.text();
                    }

                    const dom = new DOMParser().parseFromString(kmlText, 'text/xml');
                    if (dom.querySelector('parsererror')) {
                        throw new Error("Format XML KML/KMZ tidak valid.");
                    }

                    const tj = window.togeojson || window.toGeoJSON;
                    if (!tj) throw new Error("Library converter GeoJSON gagal dimuat.");

                    const convertedGeoJSON = typeof tj.kml === 'function' ? tj.kml(dom) : (tj.default && typeof tj.default.kml === 'function' ? tj.default.kml(dom) : null);
                    if (!convertedGeoJSON?.features?.length) throw new Error('Data KML kosong atau tidak terdeteksi.');

                    const boundaryId = 'b_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                    const { error: insertError } = await supabaseClient.from('boundaries').insert([{ id: boundaryId, name: file.name, geojson: convertedGeoJSON }]);
                    if (insertError) throw insertError;

                    showToast('File berhasil diunggah ke Supabase!', 'success');
                    fileInput.value = '';
                    await loadBoundaries();
                    
                    document.getElementById('boundary-select').value = boundaryId;
                    loadBoundaryToMap(boundaryId);

                } catch (err) {
                    showToast('Gagal memproses file: ' + err.message, 'error');
                } finally {
                    uploadBtn.innerText = 'Proses & Simpan'; uploadBtn.disabled = false;
                }
            });
        }

        async function loadBoundaryToMap(boundaryId) {
            currentLayerGroup.clearLayers();
            currentBoundaryGeoJSON = null;

            if (!boundaryId) {
                loadObjectsFromDB(boundaryId);
                return;
            }

            try {
                const { data, error } = await supabaseClient.from('boundaries').select('*').eq('id', boundaryId).single();
                if (error) throw error;

                if (data?.geojson) {
                    currentBoundaryGeoJSON = data.geojson;
                    const currentRole = roleSelector ? roleSelector.value : 'surveyor';
                    const layer = L.geoJSON(data.geojson, {
                        style: feature => {
                            const type = feature.geometry?.type || '';
                            if (type.includes('Polygon')) return { color: "#3b82f6", weight: 2, fillOpacity: 0.15 };
                            if (type.includes('LineString')) return { color: "#ef4444", weight: 3, opacity: 0.85 };
                        },
                        pointToLayer: (feature, latlng) => {
                            if (currentRole === 'updater') return null; 
                            return L.circleMarker(latlng, { radius: 5, fillColor: "#3b82f6", color: "#fff", weight: 2, opacity: 1, fillOpacity: 0.9 })
                                .bindPopup(`<div class="text-xs text-center"><b class="text-blue-600">${escapeHtml(feature.properties?.name || 'Titik KML')}</b></div>`);
                        }
                    }).addTo(currentLayerGroup);
                    
                    try { map.fitBounds(layer.getBounds(), { padding: [50, 50] }); } catch(e) {}
                }
                loadObjectsFromDB(boundaryId);
            } catch (err) {
                console.error("Gagal memuat area:", err);
            }
        }

        const boundarySelectEl = document.getElementById('boundary-select');
        if (boundarySelectEl) {
            boundarySelectEl.addEventListener('change', (e) => {
                loadBoundaryToMap(e.target.value);
                if (window.innerWidth < 768) {
                    sidebar.classList.add('-translate-x-full');
                    setTimeout(() => { if (window.map) window.map.invalidateSize(); }, 300);
                }
            });
        }

        // ==========================================
        // 5. OBJEK SURVEY (FOLDERS & REALTIME)

                                <div class="flex items-center space-x-2">

                                    <span class="font-bold text-gray-700">Homepass</span>

                            </div>

                            <div id="folder-content-pole" class="p-2 space-y-2 border-t bg-gray-50/50 ${folderOpenState.Pole ? '' : 'hidden'}">

        window.editObject = async (id, currentTitle) => {

            const { data: currentObj } = await supabaseClient.from('survey_objects').select('title').eq('id', id).single();
            let prefix = '[Homepass] ';

        let activeSurveyChannel = null;
        function setupRealtimeSubscription() {
            if (activeSurveyChannel) {
                supabaseClient.removeChannel(activeSurveyChannel);
                activeSurveyChannel = null;
            }
            activeSurveyChannel = supabaseClient.channel('survey_objects_changes_' + Math.random())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'survey_objects' }, payload => {
                    const currentBoundaryId = document.getElementById('boundary-select').value;
                    const affectedBoundaryId = payload.new?.boundary_id || payload.old?.boundary_id;
                    if (affectedBoundaryId && affectedBoundaryId === currentBoundaryId) {
                        loadObjectsFromDB(currentBoundaryId);

                }).subscribe();

        map.on('click', (e) => {

        if (modalSaveBtn) {

                if (!pendingLatLng) return;
                const boundaryId = document.getElementById('boundary-select').value;
                const currentRole = roleSelector ? roleSelector.value : 'surveyor';
                
                let category = modalCategorySelect ? modalCategorySelect.value : 'Homepass';
                if (currentRole === 'updater') {
                    category = 'Pole'; // Paksa proteksi role updater
                }

                const poleType = modalPoleSelect ? modalPoleSelect.value : 'New';
                const rawName = modalObjectName ? modalObjectName.value.trim() || 'Objek Baru' : 'Objek Baru';

                let storedTitle = '[Homepass] ' + rawName;
                if (category === 'Pole') {
                    if (poleType === 'New') storedTitle = '[PoleNew] ' + rawName;
                    else if (poleType === 'Ext') storedTitle = '[PoleExt] ' + rawName;
                }

                const newObj = {
                    id: 'obj_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                    boundary_id: boundaryId,
                    lat: pendingLatLng.lat, 
                    lng: pendingLatLng.lng,
                    title: storedTitle,
                    surveyor: currentUserLabel ? currentUserLabel.innerText : 'Unknown',
                    timestamp: new Date().toLocaleTimeString('id-ID')
                };

                const { error } = await supabaseClient.from('survey_objects').insert([newObj]);
                if (error) {
                    showToast('Gagal menyimpan titik: ' + error.message, 'error');
                } else {
                    showToast('Titik berhasil ditambahkan!', 'success');
                    closeSurveyModal();
                    loadObjectsFromDB(boundaryId);
                }
            };
        }

        const btnMyLocation = document.getElementById('btn-my-location');
        if (btnMyLocation) {
            btnMyLocation.addEventListener('click', () => {
                if (!navigator.geolocation) return showToast('Browser tidak mendukung akses GPS.', 'error');
                
                btnMyLocation.classList.add('animate-pulse', 'bg-blue-100');
                navigator.geolocation.getCurrentPosition(async (position) => {
                    btnMyLocation.classList.remove('animate-pulse', 'bg-blue-100');
                    const lat = position.coords.latitude, lng = position.coords.longitude;
                    map.setView([lat, lng], 18);

                    if (userLocationMarker) userLocationMarker.setLatLng([lat, lng]);
                    else {

                            icon: L.divIcon({

                                iconSize: [18, 18], iconAnchor: [9, 9]

                    userLocationMarker.openPopup();

                        pendingLatLng = { lat, lng };

                    showToast('Gagal melacak lokasi GPS: ' + err.message, 'error');
                }, { enableHighAccuracy: true, timeout: 10000 });

        }

        // ==========================================
        // 7. EXPORT KMZ LOGIC
        // ==========================================
        function geometryToKml(geom) {
            if (!geom || !geom.type || !geom.coordinates) return '';
            
            if (geom.type === 'Point') {
                return `<Point><coordinates>${geom.coordinates.join(',')}</coordinates></Point>`;
            }
            if (geom.type === 'LineString') {
                return `<LineString><coordinates>${geom.coordinates.map(c => c.join(',')).join(' ')}</coordinates></LineString>`;
            }
            if (geom.type === 'Polygon') {
                const rings = geom.coordinates.map((ring, idx) => {
                    const coordStr = ring.map(c => c.join(',')).join(' ');
                    const tag = idx === 0 ? 'outerBoundaryIs' : 'innerBoundaryIs';
                    return `<${tag}><LinearRing><coordinates>${coordStr}</coordinates></LinearRing></${tag}>`;
                });
                return `<Polygon>${rings.join('')}</Polygon>`;
            }
            if (geom.type === 'MultiPoint') {
                const points = geom.coordinates.map(pt => `<Point><coordinates>${pt.join(',')}</coordinates></Point>`);
                return `<MultiGeometry>${points.join('')}</MultiGeometry>`;
            }
            if (geom.type === 'MultiLineString') {
                const lines = geom.coordinates.map(line => `<LineString><coordinates>${line.map(c => c.join(',')).join(' ')}</coordinates></LineString>`);
                return `<MultiGeometry>${lines.join('')}</MultiGeometry>`;
            }
            if (geom.type === 'MultiPolygon') {
                const polys = geom.coordinates.map(poly => {
                    const rings = poly.map((ring, idx) => {
                        const coordStr = ring.map(c => c.join(',')).join(' ');
                        const tag = idx === 0 ? 'outerBoundaryIs' : 'innerBoundaryIs';
                        return `<${tag}><LinearRing><coordinates>${coordStr}</coordinates></LinearRing></${tag}>`;
                    });
                    return `<Polygon>${rings.join('')}</Polygon>`;
                });
                return `<MultiGeometry>${polys.join('')}</MultiGeometry>`;
            }
            return '';
        }

        const btnExportKmz = document.getElementById('btn-export-kmz');
        if (btnExportKmz) {
            btnExportKmz.addEventListener('click', async () => {
                const boundaryId = document.getElementById('boundary-select').value;
                if (!boundaryId) return showToast('Pilih area boundary terlebih dahulu!', 'error');

                showToast('Menyiapkan file KMZ...', 'info');

                try {
                    const [boundRes, objRes] = await Promise.all([
                        supabaseClient.from('boundaries').select('*').eq('id', boundaryId).single(),
                        supabaseClient.from('survey_objects').select('*').eq('boundary_id', boundaryId)
                    ]);

                    const boundaryData = boundRes.data;
                    const allData = objRes.data || [];

                    let kmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>Hasil Survey - ${boundaryData ? escapeHtml(boundaryData.name) : 'Export'}</name>
    
    <Style id="iconHomepass">
      <IconStyle><scale>1.1</scale><Icon><href>http://maps.google.com/mapfiles/kml/paddle/blu-circle.png</href></Icon></IconStyle>
    </Style>
    <Style id="iconPoleExt">
      <IconStyle><scale>1.0</scale><Icon><href>http://maps.google.com/mapfiles/kml/paddle/wht-circle.png</href></Icon></IconStyle>
    </Style>
    <Style id="iconPoleNewT7_25">
      <IconStyle><scale>1.0</scale><Icon><href>http://maps.google.com/mapfiles/kml/paddle/purple-circle.png</href></Icon></IconStyle>
    </Style>
    <Style id="iconPoleNewT7_3">
      <IconStyle><scale>1.0</scale><Icon><href>http://maps.google.com/mapfiles/kml/paddle/ltblu-circle.png</href></Icon></IconStyle>
    </Style>
    <Style id="iconPoleNewT7_4">
      <IconStyle><scale>1.0</scale><Icon><href>http://maps.google.com/mapfiles/kml/paddle/grn-circle.png</href></Icon></IconStyle>
    </Style>
    <Style id="iconPoleNewT9_4">
      <IconStyle><scale>1.0</scale><Icon><href>http://maps.google.com/mapfiles/kml/paddle/red-circle.png</href></Icon></IconStyle>
    </Style>
    <Style id="boundaryStyle">
      <PolyStyle><color>4Df6823b</color><fill>1</fill><outline>1</outline></PolyStyle>
      <LineStyle><color>fff6823b</color><width>2</width></LineStyle>
    </Style>

    <Folder>
      <name>Area Boundary</name>`;

                    if (boundaryData?.geojson?.features) {
                        boundaryData.geojson.features.forEach(f => {
                            const geomXml = geometryToKml(f.geometry);
                            if (geomXml) {
                                kmlContent += `
      <Placemark>
        <name>${escapeHtml(f.properties?.name || 'Boundary Geometry')}</name>
        <styleUrl>#boundaryStyle</styleUrl>
        ${geomXml}
      </Placemark>`;
                            }
                        });
                    }

                    kmlContent += `
    </Folder>`;

                    const homepassObjects = allData.filter(item => getObjectTypeAndCleanName(item.title).type === 'Homepass');
                    const poleObjects = allData.filter(item => getObjectTypeAndCleanName(item.title).type.startsWith('Pole'));

                    kmlContent += `
    <Folder>
      <name>Homepass (${homepassObjects.length})</name>`;

                    homepassObjects.forEach(item => {
                        const parsed = getObjectTypeAndCleanName(item.title);
                        kmlContent += `
      <Placemark>
        <name>${escapeHtml(parsed.cleanTitle)}</name>
        <description><![CDATA[<b>Kategori:</b> Homepass<br><b>Surveyor:</b> ${escapeHtml(item.surveyor)}<br><b>Waktu:</b> ${escapeHtml(item.timestamp)}]]></description>
        <styleUrl>#iconHomepass</styleUrl>
        <Point><coordinates>${item.lng},${item.lat},0</coordinates></Point>
      </Placemark>`;
                    });

                    kmlContent += `
    </Folder>`;

                    kmlContent += `
    <Folder>
      <name>Pole (${poleObjects.length})</name>`;

                    poleObjects.forEach(item => {
                        const parsed = getObjectTypeAndCleanName(item.title);
                        let styleUrl = '#iconPoleNewT9_4';
                        const t = parsed.cleanTitle;
                        if (parsed.type === 'PoleExt') {
                            styleUrl = '#iconPoleExt';
                        } else if (t.includes('T7-2,5')) {
                            styleUrl = '#iconPoleNewT7_25';
                        } else if (t.includes('T7-3')) {
                            styleUrl = '#iconPoleNewT7_3';
                        } else if (t.includes('T7-4')) {
                            styleUrl = '#iconPoleNewT7_4';
                        } else if (t.includes('T9-4')) {
                            styleUrl = '#iconPoleNewT9_4';
                        }

                        kmlContent += `
      <Placemark>
        <name>${escapeHtml(parsed.cleanTitle)}</name>
        <description><![CDATA[<b>Kategori:</b> ${escapeHtml(parsed.type)}<br><b>Surveyor:</b> ${escapeHtml(item.surveyor)}<br><b>Waktu:</b> ${escapeHtml(item.timestamp)}]]></description>
        <styleUrl>${styleUrl}</styleUrl>
        <Point><coordinates>${item.lng},${item.lat},0</coordinates></Point>
      </Placemark>`;
                    });

                    kmlContent += `
    </Folder>
  </Document>
</kml>`;

                    const zip = new JSZip();
                    zip.file("doc.kml", kmlContent);
                    const content = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });

                    const url = URL.createObjectURL(content);
                    const a = document.createElement('a');
                    a.href = url;
                    const safeName = boundaryData?.name ? boundaryData.name.replace(/\.[^/.]+$/, "").replace(/\W+/g, '_') : 'survey_data';
                    a.download = `${safeName}.kmz`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('File KMZ berhasil diekspor!', 'success');
                } catch (err) {
                    console.error(err);
                    showToast('Gagal mengekspor KMZ: ' + err.message, 'error');
                }
            });
        }

        // ==========================================
        // INISIASI APLIKASI
        // ==========================================
        checkSupabaseConnection();
        checkAuthSession();

        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN' && session?.user) {
                handleSuccessfulLogin(session.user);
            } else if (event === 'SIGNED_OUT') {
                if (activeSurveyChannel) {
                    supabaseClient.removeChannel(activeSurveyChannel);
                    activeSurveyChannel = null;
                }
                if (loginModal) loginModal.classList.remove('hidden');
                document.getElementById('app-header').classList.add('hidden');
                document.getElementById('app-main').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
